<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Admin - Wijaya Interior & Advertising</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#f7f8fa,#e9eef2);font-family:Inter,system-ui,sans-serif;color:#101318}
.card{width:min(430px,100%);background:white;border:1px solid #e8ebef;border-radius:25px;padding:34px;box-shadow:0 25px 70px #10131818}
.logo{width:66px;height:66px;object-fit:contain;margin-bottom:15px}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:800;color:#168ac4;text-transform:uppercase}
h1{font-size:29px;letter-spacing:-.04em;margin:8px 0}p{color:#667085;font-size:14px;line-height:1.6}
label{display:block;font-size:12px;font-weight:800;margin:18px 0 7px}
input{width:100%;padding:14px;border:1px solid #dfe4e9;border-radius:12px;font:inherit;outline:none}input:focus{border-color:#168ac4;box-shadow:0 0 0 3px #168ac41a}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:999px;background:#101318;color:white;font:inherit;font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}.message{margin-top:14px;font-size:13px;color:#b42318;min-height:20px}.back{display:block;text-align:center;margin-top:22px;color:#168ac4;text-decoration:none;font-size:13px;font-weight:750}
</style></head><body><main class="card">
<img class="logo" src="logo-wijaya.png" alt="Logo Wijaya"><div class="eyebrow">Area administrator</div><h1>Login Admin</h1>
<p>Masuk untuk mengelola video YouTube dan TikTok Wijaya Interior & Advertising.</p>
<form id="login-form"><label for="username">Username</label><input id="username" autocomplete="username" required placeholder="Username administrator">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Password">
<button id="submit" type="submit">LOGIN</button><div class="message" id="message" role="status"></div></form>
<a class="back" href="index.html">← Kembali ke website</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const form=document.getElementById('login-form'),btn=document.getElementById('submit'),msg=document.getElementById('message');
form.addEventListener('submit',async e=>{
 e.preventDefault();msg.textContent='';btn.disabled=true;btn.textContent='MEMERIKSA...';
 try{
  const cfg=window.WIJAYA_SUPABASE||{};
  if(!cfg.url||!cfg.anonKey||cfg.url.includes('YOUR_')||cfg.anonKey.includes('YOUR_')) throw new Error('Sistem login belum dikonfigurasi. Selesaikan pengaturan Supabase terlebih dahulu.');
  const response=await fetch(cfg.url+'/functions/v1/admin-login',{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.anonKey,'Authorization':'Bearer '+cfg.anonKey},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
  const data=await response.json();
  if(!response.ok) throw new Error(data.error||'Username atau password tidak sesuai.');
  sessionStorage.setItem('wijaya_admin_session',JSON.stringify(data.session));
  location.href='admin.html';
 }catch(err){msg.textContent=err.message||'Login gagal. Periksa koneksi dan konfigurasi.';btn.disabled=false;btn.textContent='LOGIN';}
});
</script></body></html>
